<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@300;700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --paper:#E9ECE6; --surface:#DDE2DA; --ink:#15211C; --soft:#4B5A52; --accent:#1F5E48; --line:#C4CCC3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
  .home { padding: 96px 72px 0; }
  .name { display: flex; align-items: baseline; justify-content: space-between; font-family: Zain, sans-serif; font-size: 88px; line-height: 1.2; white-space: nowrap; padding-bottom: 28px; border-bottom: 2px solid var(--ink); }
  .name b { font-weight: 800; letter-spacing: -0.03em; }
  .name span { font-weight: 300; color: var(--soft); }
  .pitch { margin-top: 44px; max-width: 20ch; font-family: Zain, sans-serif; font-size: 58px; line-height: 1.15; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; justify-content: space-between; align-items: end; font-family: "IBM Plex Mono", monospace; font-size: 22px; }
  .foot p { color: var(--soft); }
  .foot strong { color: var(--accent); font-weight: 500; }

  .case { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 72px 72px 0; height: 100%; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); }
  .title { margin-top: 18px; font-family: Zain, sans-serif; font-weight: 800; font-size: 92px; line-height: 1; letter-spacing: -0.03em; }
  .kicker { margin-top: 20px; font-size: 30px; line-height: 1.35; color: var(--soft); }
  .stack { position: absolute; left: 72px; bottom: 64px; width: 500px; border-top: 2px solid var(--ink); padding-top: 18px; font-family: "IBM Plex Mono", monospace; font-size: 19px; line-height: 1.5; color: var(--soft); }
  .stack strong { display: block; margin-top: 8px; color: var(--accent); font-weight: 500; }
  .media { align-self: start; height: 486px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .media img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .flow { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 32px 40px; }
  .node { display: flex; gap: 16px; align-items: baseline; padding: 14px 18px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); font-size: 24px; font-weight: 600; }
  .node i { font-family: "IBM Plex Mono", monospace; font-style: normal; font-weight: 400; color: var(--soft); font-size: 19px; }
  .node.bought { border: 2px dashed var(--accent); }
  .node.bought i { color: var(--accent); }
</style>
</head>
<body>
<main id="root"></main>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.getElementById("root");
  const kind = q.get("kind") || "home";
  if (kind === "home") {
    root.innerHTML = `
      <div class="home">
        <div class="name"><b>Youseef Tareq</b><span lang="ar" dir="rtl">يوسف طارق</span></div>
        <p class="pitch">Complete web products, in Arabic and English.</p>
      </div>
      <div class="foot">
        <p>Software engineer, Cairo. MEAN stack.</p>
        <strong>soking.digital</strong>
      </div>`;
  } else {
    const nodes = (q.get("nodes") || "").split("|").filter(Boolean);
    const media = q.get("img")
      ? `<img src="${q.get("img")}" alt="">`
      : `<div class="flow">${nodes.map((n, i) => {
          const bought = n.startsWith("*");
          return `<div class="node${bought ? " bought" : ""}"><i>${i + 1}</i>${bought ? n.slice(1) : n}</div>`;
        }).join("")}</div>`;
    root.innerHTML = `
      <div class="case">
        <div>
          <p class="label">Youseef Tareq, case study</p>
          <h1 class="title">${q.get("title")}</h1>
          <p class="kicker">${q.get("kicker")}</p>
        </div>
        <div class="media">${media}</div>
      </div>
      <div class="stack">${q.get("stack")}<strong>soking.digital</strong></div>`;
  }
</script>
</body>
</html>
