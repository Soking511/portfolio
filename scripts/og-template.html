<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --paper:#F4F4F1; --surface:#EAEAE5; --ink:#17171A; --soft:#5A5A63; --accent:#CF4318; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
  .home { display: grid; grid-template-columns: 1fr 400px; gap: 48px; align-items: center; height: 100%; padding: 64px 64px 64px 72px; }
  .name { font-family: Rubik, sans-serif; }
  .name b { display: block; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; }
  .name span { display: block; margin-top: 18px; font-weight: 400; font-size: 44px; line-height: 1.3; color: var(--soft); text-align: left; }
  .pitch { margin-top: 28px; max-width: 22ch; font-size: 30px; line-height: 1.4; }
  .site { margin-top: 36px; font-size: 24px; font-weight: 600; }
  .site::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 50%; background: var(--accent); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tiles div { height: 230px; border-radius: 24px; }

  .case { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 64px 64px 0 72px; height: 100%; }
  .label { font-size: 20px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .title { margin-top: 18px; font-family: Rubik, sans-serif; font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -0.04em; }
  .kicker { margin-top: 20px; font-size: 30px; line-height: 1.35; color: var(--soft); }
  .stack { position: absolute; left: 72px; bottom: 60px; width: 480px; font-size: 22px; line-height: 1.45; color: var(--soft); }
  .stack strong { display: block; margin-top: 10px; color: var(--ink); font-weight: 600; }
  .media { position: relative; align-self: start; height: 502px; border-radius: 28px; overflow: hidden; background: var(--surface); }
  .media img { position: absolute; inset: 44px 0 0 40px; width: 760px; max-width: none; border-radius: 12px 0 0 0; }
  .flow { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 32px 40px; }
  .node { display: flex; gap: 16px; align-items: baseline; padding: 16px 20px; border-radius: 14px; background: var(--paper); font-size: 24px; font-weight: 600; }
  .node i { font-style: normal; color: var(--soft); font-size: 20px; }
  .node.bought { outline: 2px dashed var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<main id="root"></main>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.getElementById("root");
  const kind = q.get("kind") || "home";
  if (kind === "home") {
    root.innerHTML = `
      <div class="home">
        <div>
          <div class="name"><b>Youseef Tareq</b><span lang="ar" dir="rtl">يوسف طارق</span></div>
          <p class="pitch">Software engineer in Cairo. Complete web products, in Arabic and English.</p>
          <p class="site">soking.digital</p>
        </div>
        <div class="tiles">
          <div style="background:var(--accent)"></div><div style="background:var(--surface)"></div>
          <div style="background:var(--surface)"></div><div style="background:var(--ink)"></div>
        </div>
      </div>`;
  } else {
    const nodes = (q.get("nodes") || "").split("|").filter(Boolean);
    const media = q.get("img")
      ? `<img src="${q.get("img")}" alt="">`
      : `<div class="flow">${nodes.map((n, i) => {
          const bought = n.startsWith("*");
          return `<div class="node${bought ? " bought" : ""}"><i>${i + 1}</i>${bought ? n.slice(1) : n}</div>`;
        }).join("")}</div>`;
    root.innerHTML = `
      <div class="case">
        <div>
          <p class="label">Youseef Tareq, case study</p>
          <h1 class="title">${q.get("title")}</h1>
          <p class="kicker">${q.get("kicker")}</p>
        </div>
        <div class="media">${media}</div>
      </div>
      <div class="stack">${q.get("stack")}<strong>soking.digital</strong></div>`;
  }
</script>
</body>
</html>
